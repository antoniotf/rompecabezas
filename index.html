<html lang="es">

<meta charset="utf-8">
<meta name="app-version" content="V11">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Anti-caché: cada vez que se abre, se carga con una URL única (?t=...) para obligar al navegador a pedir el archivo al servidor. */
(function(){try{
  if(!/^https?:$/.test(location.protocol))return;
  var p=new URLSearchParams(location.search),t=parseInt(p.get('t'),10),now=Date.now();
  if(t&&now>=t&&now-t<60000)return;            // ya es una carga fresca
  document.documentElement.style.visibility='hidden';
  p.delete('v');p.set('t',now);
  location.replace(location.pathname+'?'+p.toString()+location.hash);
}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Rompecabezas 3 × 4</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2833;--panel2:#243440;--text:#f4f7f9;--muted:#aebbc5;--accent:#75d6bd;--gap:3px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#17232d,#0d141b 65%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
main{width:min(100%,520px);margin:0 auto;padding:20px 0 28px}
header{text-align:center;margin-bottom:16px}
h1{font-size:clamp(1.45rem,5vw,1.9rem);margin:0 0 5px;letter-spacing:.2px}
.subtitle{color:var(--muted);font-size:.92rem;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px auto 14px;max-width:420px}
.stat{background:var(--panel);border:1px solid #30414e;border-radius:13px;padding:10px 12px;text-align:center}
.stat span{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.08em;font-weight:700}
.stat strong{display:block;font-variant-numeric:tabular-nums;font-size:1.35rem;margin-top:2px}
.board-wrap{width:min(100%,420px);margin:0 auto;position:relative}
#board{width:100%;aspect-ratio:3/4;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:var(--gap);padding:var(--gap);background:#344652;border:1px solid #52636d;border-radius:14px;overflow:hidden;box-shadow:0 16px 38px #0007;touch-action:manipulation}
.tile{border:0;border-radius:7px;position:relative;overflow:hidden;padding:0;background-color:#38515b;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px #ffffff20;cursor:pointer;user-select:none;touch-action:manipulation}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tile:active{filter:brightness(1.15)}
.tile.empty{background:linear-gradient(145deg,#1b2833,#111a21);box-shadow:inset 0 0 0 1px #ffffff12;cursor:default}
.tile .number{position:absolute;right:5px;bottom:4px;background:#071018a8;color:#fff;border-radius:5px;padding:1px 5px;font-size:clamp(.65rem,2.5vw,.8rem);font-weight:700;text-shadow:0 1px 2px #000}
#message{min-height:24px;text-align:center;color:var(--accent);font-weight:650;margin:12px 0 4px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:420px;margin:12px auto 0}
button,.file-label{font:inherit;border:1px solid #405563;border-radius:12px;background:var(--panel2);color:var(--text);padding:12px 10px;min-height:46px;font-weight:650;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
button.primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#10221f}
button:active,.file-label:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
.file-label{grid-column:1/-1;background:var(--panel);border-style:dashed}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.note{max-width:420px;margin:12px auto 0;color:var(--muted);font-size:.78rem;line-height:1.45;text-align:center}
#preview{position:absolute;inset:0;background:#071018eF;display:none;align-items:center;justify-content:center;border-radius:14px;padding:14px;z-index:3}
#preview img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#preview button{position:absolute;right:10px;top:10px;min-height:38px;padding:7px 12px}
@media(min-height:850px){main{padding-top:30px}.stats{margin-top:20px;margin-bottom:18px}}
.version{text-align:center;color:var(--muted);opacity:.55;font-size:.62rem;margin:10px 0 0;letter-spacing:.08em}
.tile.last{animation:lastIn .9s ease-out both;cursor:default}
@keyframes lastIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

.wide{grid-column:1/-1}
#recordsBtn{font-family:"PS2P","Courier New",monospace;font-size:.7rem;letter-spacing:.02em;background:#000;color:#ffe500;border:2px solid #ffe500;border-radius:4px;text-transform:uppercase}
#records{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000;font-family:"PS2P","Courier New",monospace;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px)}
#records::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px)}
#records .panel{width:min(100%,460px);max-height:100%;overflow:auto;background:#000;color:#fff;font-size:clamp(8px,2.6vw,12px);line-height:1.5}
.rec-hi{text-align:center;margin:6px 0 18px}
.rec-hi span{display:block;color:#fff;margin-bottom:8px}
.rec-hi b{display:block;color:#fff;font-weight:400;font-size:1.25em}
#records h2{margin:0 0 18px;text-align:center;font-size:1.1em;font-weight:400;color:#fff;letter-spacing:.04em}
.rec-who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px;color:#6fa8ff}
.rec-who strong{color:#ffe500;font-weight:400;text-transform:uppercase}
#records button{font-family:inherit;font-size:.9em;text-transform:uppercase;background:#000;color:#ffe500;border:2px solid #ffe500;border-radius:0;min-height:44px;padding:8px 10px;letter-spacing:0}
#records button.primary{background:#ffe500;color:#000}
.rec-who button{min-height:34px;padding:5px 8px;font-size:.78em}
#nickEdit{display:none;margin-bottom:14px}
#nickEdit p{margin:0 0 12px;color:#fff;line-height:1.9;font-size:.9em}
#nickInput{width:100%;font-family:inherit;font-size:14px;color:#ffe500;background:#000;border:2px solid #ffe500;border-radius:0;padding:12px 10px;margin-bottom:8px;text-transform:uppercase;outline:none}
#nickEdit .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#nickHint{min-height:16px;color:#ff2b2b;font-size:.85em;margin:0 0 8px}
.editing #recTable,.editing .rec-hi,.editing #recStatus,.editing .rec-foot,.editing #recNote{display:none}
#recTable{width:100%;border-collapse:collapse;table-layout:fixed}
#recTable th{color:#ffe500;font-weight:400;text-align:left;padding:0 0 14px}
#recTable td{padding:0 0 .95em;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#recTable th:nth-child(1),#recTable td:nth-child(1){width:15%}
#recTable th:nth-child(2),#recTable td:nth-child(2){width:26%}
#recTable th:nth-child(3),#recTable td:nth-child(3){width:17%}
#recTable td.nick{text-transform:uppercase}
#recBody tr:nth-child(5n+1){color:#ff2b2b}
#recBody tr:nth-child(5n+2){color:#f2f2f2}
#recBody tr:nth-child(5n+3){color:#6fa8ff}
#recBody tr:nth-child(5n+4){color:#ff8c1a}
#recBody tr:nth-child(5n+5){color:#ffe500}
#recStatus{min-height:16px;text-align:center;color:#fff;line-height:1.9;margin:10px 0 4px}
#recNote{text-align:center;color:#6fa8ff;line-height:1.9;min-height:16px;margin:0 0 12px;font-size:.9em}
.rec-foot{text-align:center;color:#ffe500;margin:14px 0 16px}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<main>

<section class="stats" aria-label="Estadísticas">
<div class="stat"><span>MOVIMIENTOS</span><strong id="moves">0</strong></div>
<div class="stat"><span>TIEMPO</span><strong id="time">00:00</strong></div>
</section>

<div class="board-wrap">
<div id="board" role="group" aria-label="Tablero de rompecabezas de 3 columnas y 4 filas"></div>
<div id="preview"><button id="closePreview" type="button">Cerrar ✕</button><img id="previewImage" alt="Imagen que hay que reconstruir"></div>
</div>
<div id="message" aria-live="polite"></div>

<div class="controls">
<button id="hint" type="button">▧ Ver imagen</button>
<button id="sound" type="button" aria-pressed="true">♫ Sonido: ON</button>
<label class="file-label" for="photo">＋ Elegir fotografía del móvil</label>
<input id="photo" type="file" accept="image/*">
<button class="wide" id="recordsBtn" type="button">Tabla de récords</button>
<button class="primary" id="newGame" type="button">Nueva partida</button>
</div>
<p class="version" id="version"></p>
</main>

<div id="records" role="dialog" aria-modal="true" aria-label="Tabla de récords">
<div class="panel">
<div class="rec-hi"><span>MEJOR TIEMPO</span><b id="recHi">--:--</b></div>
<h2>LOS 10 MEJORES</h2>
<div class="rec-who" id="recWho"><span>JUGADOR: <strong id="recNick"></strong></span><button id="changeNick" type="button">Cambiar</button></div>
<div id="nickEdit">
<p id="nickText">Elige un seudónimo para aparecer en la clasificación (entre 2 y 20 caracteres).</p>
<input id="nickInput" type="text" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="TU SEUDÓNIMO">
<p id="nickHint"></p>
<div class="row"><button id="nickCancel" type="button">Cancelar</button><button class="primary" id="nickSave" type="button" style="grid-column:auto">Guardar</button></div>
</div>
<div id="recNote"></div>
<table id="recTable"><thead><tr><th>POS</th><th>TIEMPO</th><th>MOV.</th><th>JUGADOR</th></tr></thead><tbody id="recBody"></tbody></table>
<div id="recStatus"></div>
<div class="rec-foot blink">¡CONSIGUE TU PUESTO!</div>
<div class="controls" style="margin-top:8px"><button class="wide" id="recClose" type="button">Cerrar</button></div>
</div>
</div>
<script>
(() => {
  // ---- Versión y anti-caché ----
  const APP_VERSION=(document.querySelector('meta[name="app-version"]')||{}).content||'V??';
  document.getElementById('version').textContent=APP_VERSION;
  // Efectos retro sintetizados con Web Audio: no necesita archivos externos.
  let soundEnabled = true;
  let audioContext = null;
  function audio() {
    if (!soundEnabled) return null;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioContext) audioContext = new Ctx();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    } catch (_) { return null; }
  }
  function beep(freq, duration=0.075, type='square', volume=0.045, delay=0) {
    const ctx = audio(); if (!ctx) return;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    const start = ctx.currentTime + delay;
    osc.type = type; osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(start); osc.stop(start + duration + 0.015);
  }

  // ---- Música de fondo: bucle chiptune original (onda cuadrada + bajo triangular) ----
  // Notas en semitonos respecto a La4 (440 Hz); null = silencio. 8 pasos (corcheas) por compás, 4 compases.
  const MUSIC_STEP_START = 0.36;      // segundos por paso al empezar (muy lento)
  const MUSIC_STEP_END = 0.10;        // segundos por paso al llegar al tempo máximo
  const MUSIC_RAMP = 100;             // segundos de música hasta alcanzar el tempo máximo
  let musicElapsed = 0;               // segundos de música sonados en esta partida
  const musicStepNow = () => MUSIC_STEP_START - (MUSIC_STEP_START - MUSIC_STEP_END) * Math.min(1, musicElapsed / MUSIC_RAMP);
  const MUSIC_LEAD = [
    5,null,8,null,10,8,5,null,
    7,null,10,null,12,10,7,null,
    8,null,12,null,15,12,8,null,
    12,10,8,7,5,null,null,null
  ];
  const MUSIC_BASS = [
    -19,null,-12,null,-19,null,-12,null,
    -21,null,-14,null,-21,null,-14,null,
    -23,null,-16,null,-23,null,-16,null,
    -24,null,-17,null,-24,null,-17,null
  ];
  let musicTimer = null, musicMaster = null, musicStep = 0, musicNext = 0;
  const noteHz = n => 440 * Math.pow(2, n / 12);
  function musicNote(ctx, dest, n, when, dur, type, vol) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();

  previewImage.src=imageUrl;

  function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function updateStats(){movesEl.textContent=moves;timeEl.textContent=formatTime(seconds)}
  function startClock(){if(!started){started=true;musicElapsed=0;startMusic();timer=setInterval(()=>{seconds++;timeEl.textContent=formatTime(seconds)},1000)}}
  function stopClock(){stopMusic();if(timer){clearInterval(timer);timer=null}}
  function neighbors(index){
    const r=Math.floor(index/COLS),c=index%COLS,out=[];
    if(r>0)out.push(index-COLS);if(r<ROWS-1)out.push(index+COLS);
    if(c>0)out.push(index-1);if(c<COLS-1)out.push(index+1);
    return out;
  }
  function render(){
    boardEl.innerHTML='';
    state.forEach((value,index)=>{
      const tile=document.createElement('button');
      const lastPiece=value===0&&finished;   // al resolver, el hueco se rellena con la pieza que falta (la última)
      tile.type='button';tile.className='tile'+(value===0&&!lastPiece?' empty':'')+(lastPiece?' last':'');
      tile.setAttribute('aria-label',value===0?'Hueco':`Pieza ${value}`);
      if(value!==0||lastPiece){
        const original=lastPiece?SIZE-1:value-1, row=Math.floor(original/COLS), col=original%COLS;
        tile.style.backgroundImage=`url("${imageUrl}")`;
        tile.style.backgroundSize=`${COLS*100}% ${ROWS*100}%`;
        tile.style.backgroundPosition=`${col/(COLS-1)*100}% ${row/(ROWS-1)*100}%`;
        const number=document.createElement('span');number.className='number';number.textContent=lastPiece?SIZE:value;tile.appendChild(number);
        if(lastPiece)tile.disabled=true;else tile.addEventListener('click',()=>tryMove(index));
      }else{
        tile.disabled=true;
      }
      boardEl.appendChild(tile);
    });
  }
  function tryMove(index){
    if(finished)return;
    const empty=state.indexOf(0);
    if(!neighbors(empty).includes(index))return;
    startClock();
    sfxMove();
    [state[index],state[empty]]=[state[empty],state[index]];
    moves++;updateStats();render();
    if(isSolved()){
      finished=true;render();stopClock();sfxWin();messageEl.textContent=`¡Conseguido! ${moves} movimientos en ${formatTime(seconds)}.`;onWin();
    }else messageEl.textContent='';
  }
  function isSolved(){return state.every((v,i)=>v===SOLVED[i])}
  function shuffle(silent){
    stopClock();state=SOLVED.slice();moves=0;seconds=0;started=false;finished=false;updateStats();
    preview.style.display='none';
    let previous=-1;
    // Mezcla mediante movimientos legales desde la solución: siempre es resoluble.
    for(let i=0;i<140;i++){
      const empty=state.indexOf(0);
      let options=neighbors(empty).filter(n=>n!==previous);
      if(!options.length)options=neighbors(empty);
      const chosen=options[Math.floor(Math.random()*options.length)];
      [state[chosen],state[empty]]=[state[empty],state[chosen]];
      previous=empty;
    }
    if(isSolved())shuffle(silent);
    render();if(silent!==true)sfxShuffle();messageEl.textContent='¡A jugar! Desliza una ficha junto al hueco.';
  }
  document.getElementById('sound').addEventListener('click',()=>{
    soundEnabled=!soundEnabled;
    const btn=document.getElementById('sound');
    btn.textContent=soundEnabled?'♫ Sonido: ON':'♫ Sonido: OFF';
    btn.setAttribute('aria-pressed',String(soundEnabled));
    if(soundEnabled){sfxClick();if(musicWanted())startMusic();}else stopMusic();
  });
      document.getElementById('newGame').addEventListener('click',newGameFromGithub);
  document.getElementById('hint').addEventListener('click',()=>{sfxClick();preview.style.display='flex'});
  document.getElementById('closePreview').addEventListener('click',()=>{sfxClick();preview.style.display='none'});
  preview.addEventListener('click',e=>{if(e.target===preview)preview.style.display='none'});
  photoInput.addEventListener('change',()=>{
    const file=photoInput.files&&photoInput.files[0];if(!file)return;
    if(!file.type.startsWith('image/')){messageEl.textContent='Selecciona un archivo de imagen.';return}
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        // Recorte central 3:4 para que las 12 fichas resulten cuadradas.
        const targetRatio=COLS/ROWS, sourceRatio=img.width/img.height;
        let sx=0,sy=0,sw=img.width,sh=img.height;
        if(sourceRatio>targetRatio){sw=img.height*targetRatio;sx=(img.width-sw)/2}
        else{sh=img.width/targetRatio;sy=(img.height-sh)/2}
        const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,sx,sy,sw,sh,0,0,900,1200);
        imageUrl=canvas.toDataURL('image/jpeg',.9);previewImage.src=imageUrl;
        bestImageName=file.name;shuffle();messageEl.textContent='Fotografía cargada. ¡A reconstruirla!';
      };
      img.onerror=()=>messageEl.textContent='No se pudo abrir esa fotografía.';
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
  // ---- Fotos desde la carpeta imagenes de este repositorio de GitHub ----
  // Repositorio público: antoniotf/rompecabezas, rama main.
  const GITHUB_OWNER='antoniotf';
  const GITHUB_REPO='rompecabezas';
  const GITHUB_BRANCH='main';
  const GITHUB_IMAGE_FOLDER='imagenes';
  let githubFiles=null, githubBusy=false;

  function loadImageCors(url){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.crossOrigin='anonymous';
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(new Error('no se pudo abrir '+url));
      img.src=url;
    });
  }
  function cropToDataUrl(img){
    // Recorte central 3:4 a 900×1200 para que las 12 casillas resulten cuadradas.
    const targetRatio=COLS/ROWS, sourceRatio=img.width/img.height;
    let sx=0,sy=0,sw=img.width,sh=img.height;
    if(sourceRatio>targetRatio){sw=img.height*targetRatio;sx=(img.width-sw)/2}
    else{sh=img.width/targetRatio;sy=(img.height-sh)/2}
    const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;
    canvas.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,900,1200);
    return canvas.toDataURL('image/jpeg',.9);
  }

  async function listGithubImages(){
    if(githubFiles)return githubFiles;
    const endpoint=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_IMAGE_FOLDER}?ref=${GITHUB_BRANCH}`;
    const response=await fetch(endpoint,{
      cache:'no-store',
      headers:{'Accept':'application/vnd.github+json'}
    });
    if(!response.ok){
      if(response.status===404)throw new Error('no existe la carpeta imagenes o está vacía');
      if(response.status===403)throw new Error('límite temporal de consultas de GitHub alcanzado');
      throw new Error('GitHub '+response.status);
    }
    const entries=await response.json();
    const extensions=/\.(jpe?g|png|webp|gif|avif)$/i;
    githubFiles=entries
      .filter(item=>item.type==='file'&&extensions.test(item.name))
      .map(item=>({name:item.name,url:item.download_url||`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_IMAGE_FOLDER}/${item.name}`,id:item.sha}));
    return githubFiles;
  }

  // Evita repetir fotos hasta completar una vuelta por todas las imágenes disponibles.
  const SHOWN_KEY='rompecabezas_github_vistas';
  let shownIds=[];
  try{shownIds=JSON.parse(localStorage.getItem(SHOWN_KEY)||'[]')}catch(e){shownIds=[]}
  function saveShown(){try{localStorage.setItem(SHOWN_KEY,JSON.stringify(shownIds))}catch(e){}}
  function markShown(id){if(!shownIds.includes(id))shownIds.push(id);saveShown()}
  function pickNextGithubFile(files,tried){
    const ids=new Set(files.map(f=>f.id));
    shownIds=shownIds.filter(id=>ids.has(id));
    let pool=files.filter(f=>!shownIds.includes(f.id)&&!tried.includes(f.id));
    if(!pool.length){
      const last=shownIds[shownIds.length-1];
      shownIds=last?[last]:[];saveShown();
      pool=files.filter(f=>!shownIds.includes(f.id)&&!tried.includes(f.id));
      if(!pool.length)pool=files.filter(f=>!tried.includes(f.id));
    }
    return pool[Math.floor(Math.random()*pool.length)];
  }
  async function fetchRandomGithubImage(){
    const files=await listGithubImages();
    if(!files.length)throw new Error('no hay imágenes JPG, PNG, WEBP, GIF o AVIF en imagenes');
    const tried=[];
    for(let attempt=0;attempt<Math.min(5,files.length);attempt++){
      const file=pickNextGithubFile(files,tried);
      if(!file)break;
      tried.push(file.id);
      try{
        const img=await loadImageCors(file.url);
        return {url:cropToDataUrl(img),name:file.name,id:file.id};
      }catch(error){
        console.warn('No se pudo cargar '+file.name,error);
      }
    }
    throw new Error('no se pudo cargar ninguna de las imágenes de GitHub');
  }
  async function newGameFromGithub(){
    if(githubBusy)return;
    githubBusy=true;
    preview.style.display='none';
    const button=document.getElementById('newGame');
    button.disabled=true;
    messageEl.textContent='Cargando fotografía de GitHub…';
    try{
      const photo=await fetchRandomGithubImage();
      imageUrl=photo.url;previewImage.src=imageUrl;bestImageName=photo.name;markShown(photo.id);
      shuffle();
      messageEl.textContent='Nueva fotografía: '+photo.name+' ¡A jugar!';
    }catch(error){
      console.warn(error);
      messageEl.textContent='No se pudo cargar una foto de GitHub: '+error.message;
    }finally{
      githubBusy=false;
      button.disabled=false;
    }
  }


  // ---- Tabla de récords mundial (Cloudflare Worker + D1) ----
  const API_URL='https://rompecabezas-api.antoniodelgado.workers.dev';
  const NICK_KEY='rompecabezas_seudonimo', PENDING_KEY='rompecabezas_pendiente';
  let nickMem='', pendMem=null;      // copia en memoria por si localStorage no está disponible
  const recEl=document.getElementById('records');
  const recBody=document.getElementById('recBody');
  const recStatus=document.getElementById('recStatus');
  const recNote=document.getElementById('recNote');
  const nickEdit=document.getElementById('nickEdit');
  const panelEl=document.querySelector('#records .panel');
  const nickInput=document.getElementById('nickInput');
  const nickHint=document.getElementById('nickHint');

  function cleanNick(s){return String(s||'').replace(/[\u0000-\u001f\u007f<>]/g,'').trim().replace(/\s+/g,' ')}
  function getNick(){
    let n='';try{n=cleanNick(localStorage.getItem(NICK_KEY))}catch(e){}
    if(!n)n=nickMem;
    return(n.length>=2&&n.length<=20)?n:'';
  }
  function setNick(n){nickMem=n;try{localStorage.setItem(NICK_KEY,n)}catch(e){}}
  function getPending(){
    try{
      const p=JSON.parse(localStorage.getItem(PENDING_KEY)||'null');
      if(p&&Number.isInteger(p.t)&&Number.isInteger(p.m))return p;
    }catch(e){}
    return pendMem;
  }
  function setPending(p){
    pendMem=p;
    try{p?localStorage.setItem(PENDING_KEY,JSON.stringify(p)):localStorage.removeItem(PENDING_KEY)}catch(e){}
  }
  // Solo se guarda el mejor resultado pendiente (menor tiempo; a igualdad, menos movimientos).
  function addPending(t,m){const o=getPending();if(!o||t<o.t||(t===o.t&&m<o.m))setPending({t,m})}
  function fmtRecTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

  async function postRecord(nick,t,m){
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch(API_URL+'/records',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nickname:nick,time_seconds:t,moves:m}),
        signal:ctl.signal
      });
      if(r.ok)return 'ok';
      if(r.status===429||r.status>=500)return 'retry';
      return 'rejected';
    }catch(e){return 'retry'}
    finally{clearTimeout(to)}
  }
  let flushing=false;
  // Envía el resultado pendiente (si hay seudónimo). Devuelve 'ok', 'retry', 'rejected' o null.
  async function flushPending(){
    const nick=getNick(), p=getPending();
    if(!nick||!p||flushing)return null;
    flushing=true;
    try{
      const res=await postRecord(nick,p.t,p.m);
      if(res==='ok'||res==='rejected')setPending(null);   // si falla la conexión, se conserva para reintentar
      return res;
    }finally{flushing=false}
  }
  // Se llama al resolver el rompecabezas. No pregunta nada ni interrumpe la partida.
  async function onWin(){
    addPending(seconds,moves);
    if(!getNick()){
      messageEl.textContent+=' Se enviará a la clasificación cuando entres en la tabla de récords.';
      return;
    }
    const res=await flushPending();
    if(!finished)return;
    if(res==='ok')messageEl.textContent+=' Enviado a la clasificación.';
    else if(res==='retry')messageEl.textContent+=' Sin conexión con la clasificación: se reintentará más tarde.';
    else if(res==='rejected')messageEl.textContent+=' La clasificación no aceptó este resultado.';
  }

  async function loadTable(){
    recStatus.textContent='Cargando…';
    try{
      const r=await fetch(API_URL+'/records',{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const data=await r.json();
      const rows=(data.records||[]).slice(0,10);     // máximo 10, también en el juego
      recBody.textContent='';
      rows.forEach((rec,i)=>{
        const tr=document.createElement('tr');
        [[(i+1)+'º','pos'],[fmtRecTime(rec.time_seconds),'tm'],[rec.moves,'mv'],[rec.nickname,'nick']].forEach(([txt,cls])=>{
          const td=document.createElement('td');td.className=cls;td.textContent=txt;tr.appendChild(td);
        });
        recBody.appendChild(tr);
      });
      document.getElementById('recHi').textContent=rows.length?fmtRecTime(rows[0].time_seconds):'--:--';
      recStatus.textContent=rows.length?'':'Aún no hay resultados. ¡Sé el primero!';
    }catch(e){
      console.warn('Clasificación:',e);
      recBody.textContent='';
      recStatus.textContent='No se pudo cargar la clasificación. Comprueba la conexión.';
    }
  }
  async function refreshRecords(){
    recNote.textContent='';
    recStatus.textContent='Cargando…';
    const p=getPending();
    const res=await flushPending();
    if(res==='ok'&&p)recNote.textContent='Tu resultado ('+fmtRecTime(p.t)+', '+p.m+' mov.) se ha enviado.';
    else if(res==='retry')recNote.textContent='Tu resultado sigue pendiente de enviar.';
    else if(res==='rejected')recNote.textContent='La clasificación no aceptó tu resultado pendiente.';
    await loadTable();
  }
  function showNickEdit(isChange){
    nickEdit.style.display='block';
    panelEl.classList.add('editing');
    document.getElementById('recWho').style.display='none';
    document.getElementById('nickText').textContent=isChange
      ?'Nuevo seudónimo (entre 2 y 20 caracteres). Tus récords anteriores conservan el que tenías.'
      :'Elige un seudónimo para aparecer en la clasificación (entre 2 y 20 caracteres).';
    nickInput.value=isChange?getNick():'';
    nickHint.textContent='';
    nickInput.focus();
  }
  function hideNickEdit(){
    nickEdit.style.display='none';
    panelEl.classList.remove('editing');
    document.getElementById('recWho').style.display='flex';
    document.getElementById('recNick').textContent=getNick();
  }
  function openRecords(){
    sfxClick();
    recEl.style.display='flex';
    recBody.textContent='';recStatus.textContent='';recNote.textContent='';
    if(!getNick())showNickEdit(false);
    else{hideNickEdit();refreshRecords()}
  }
  function closeRecords(){recEl.style.display='none'}
  function saveNick(){
    const n=cleanNick(nickInput.value);
    if(n.length<2||n.length>20){nickHint.textContent='Escribe entre 2 y 20 caracteres.';return}
    setNick(n);hideNickEdit();refreshRecords();
  }
  document.getElementById('recordsBtn').addEventListener('click',openRecords);
  document.getElementById('recClose').addEventListener('click',()=>{sfxClick();closeRecords()});
  document.getElementById('changeNick').addEventListener('click',()=>{sfxClick();showNickEdit(true)});
  document.getElementById('nickSave').addEventListener('click',saveNick);
  document.getElementById('nickCancel').addEventListener('click',()=>{
    if(getNick()){hideNickEdit();refreshRecords()}else closeRecords();
  });
  nickInput.addEventListener('keydown',e=>{if(e.key==='Enter')saveNick()});
  recEl.addEventListener('click',e=>{if(e.target===recEl)closeRecords()});

  // Al abrir la página, el puzzle ya empieza mezclado (sin sonido, el navegador lo bloquea hasta el primer toque).
  shuffle(true);
  // Al abrir, intenta cargar una foto aleatoria de GitHub. Si falla, conserva la imagen integrada.
  (async()=>{
    try{
      const p=await fetchRandomGithubImage();
      if(!started&&moves===0){imageUrl=p.url;previewImage.src=imageUrl;bestImageName=p.name;markShown(p.id);render()}
    }catch(e){console.warn('GitHub:',e);messageEl.textContent='No se pudo cargar la carpeta imagenes de GitHub. Se mantiene la foto de ejemplo.'}
  })();
})();
</script>
